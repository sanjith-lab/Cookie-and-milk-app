name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Check money logic
        run: npm test

      - name: Create Android project
        run: npx cap add android

      - name: Let the screen resize for the keyboard
        run: |
          grep -q windowSoftInputMode android/app/src/main/AndroidManifest.xml || sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:windowSoftInputMode="adjustResize"/' android/app/src/main/AndroidManifest.xml
          grep -n "windowSoftInputMode" android/app/src/main/AndroidManifest.xml || true

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#F5F4FA' --splashBackgroundColor '#F5F4FA'

      - name: Copy web files and plugins
        run: |
          npx cap sync android
          mkdir -p android/app/src/main/res/drawable
          cp native/res/drawable/*.xml android/app/src/main/res/drawable/
          grep -n "sms-capture\|local-notifications\|speech" android/capacitor.settings.gradle || true

      - name: Set version from build number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      # Same key every build, so new versions install over the old one without losing data
      - name: Use the app's signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          # Pin the key inside Gradle too, so every build is signed with the same key
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  cookie {
                      storeFile rootProject.file("../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.cookie }
                  release { signingConfig signingConfigs.cookie }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|\.java:[0-9]+|What went wrong|FAILURE|Could not" build.log | head -25 | sed 's/^/::error::/'
            exit 1
          }

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Cookie-and-Milk-1.0.${{ github.run_number }}.apk
          # Refuse to publish if the signature isn't the app's permanent key (updates would fail)
          keytool -printcert -jarfile Cookie-and-Milk-1.0.${{ github.run_number }}.apk | tee cert.txt
          grep -q "EB:F9:82:81:EA:EA:E1:C0:81:59:C0:97:64:B2:10:C1:0A:10:7C:99:85:EB:1B:0E:3D:C1:4E:4C:39:34:C6:6A" cert.txt || { echo "::error::APK is not signed with the app's permanent key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Cookie-and-Milk-APK
          path: Cookie-and-Milk-1.0.${{ github.run_number }}.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cookie & Milk 1.0.${{ github.run_number }}
          files: Cookie-and-Milk-1.0.${{ github.run_number }}.apk
          body: Download the .apk below on your Android phone and open it to install.
