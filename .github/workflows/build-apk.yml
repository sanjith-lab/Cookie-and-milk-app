name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Check money logic
        run: npm test

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#F5F4FA' --splashBackgroundColor '#F5F4FA'

      - name: Copy web files
        run: npx cap sync android

      - name: Set version from build number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      # Same key every build, so new versions install over the old one without losing data
      - name: Use the app's signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Cookie-and-Milk-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cookie-and-Milk-APK
          path: Cookie-and-Milk-1.0.${{ github.run_number }}.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cookie and Milk 1.0.${{ github.run_number }}
          files: Cookie-and-Milk-1.0.${{ github.run_number }}.apk
          body: Download the .apk below on your Android phone and open it to install.
